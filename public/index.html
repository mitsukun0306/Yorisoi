<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Yorisoi">
  <title>Yorisoi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <h1>Yorisoi</h1>
    </div>
    <div class="actions">
      <button id="notify-btn" class="ghost" hidden>通知をオン</button>
      <button id="sync-btn" class="primary">
        <span class="sync-icon" aria-hidden="true">↻</span><span class="label">新着を確認</span>
      </button>
    </div>
  </header>

  <main>
    <section id="token-gate" class="gate" hidden>
      <h2>合言葉を入力してください</h2>
      <p>.env の YORISOI_ACCESS_TOKEN に設定した合言葉です。</p>
      <form id="token-form">
        <input id="token-input" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">開く</button>
      </form>
    </section>

    <section id="inbox">
      <nav class="tabs" role="tablist">
        <button role="tab" data-view="open" aria-selected="true">未返信 <span id="open-count" class="count"></span></button>
        <button role="tab" data-view="all" aria-selected="false">すべて</button>
      </nav>
      <div id="filters" class="filters"></div>
      <p id="notice" class="notice" hidden></p>
      <ul id="list" class="list"></ul>
      <div id="empty" class="empty" hidden>
        <p class="empty-title">未返信のメッセージはありません</p>
        <p class="empty-sub">新しい返信やメッセージが届くと、ここに表示されます。</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <template id="item-tpl">
    <li class="item">
      <div class="item-head">
        <span class="badge"></span>
        <span class="author"></span>
        <time class="time"></time>
      </div>
      <p class="text"></p>
      <div class="item-foot">
        <span class="state"></span>
        <a class="open-link" target="_blank" rel="noopener noreferrer">元の投稿を開く ↗</a>
      </div>
      <p class="sent-reply" hidden></p>
      <form class="reply">
        <textarea rows="2" placeholder="返信を入力…" aria-label="返信文"></textarea>
        <div class="reply-actions">
          <button type="button" class="ghost ignore">対応不要</button>
          <button type="submit" class="primary send">返信する</button>
        </div>
      </form>
      <button type="button" class="ghost reopen" hidden>未返信に戻す</button>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
